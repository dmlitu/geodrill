# DATABASE_URL artık Render dashboard'da manuel olarak Neon connection string'i ile set ediliyor.
# Eski Render Postgres servisi (geodrill-db) kaldırıldı — bkz. CLAUDE.md "Deployment".

services:
  - type: web
    name: geodrill-api
    # Docker instead of the native Python runtime: CAD analysis needs the
    # dwg2dxf binary (GNU LibreDWG) to read .dwg uploads, and Render's
    # native Python runtime has no apt/system-package access to install a
    # compiled dependency like that (confirmed: https://render.com/docs/native-runtimes).
    # backend/Dockerfile builds dwg2dxf from source and bakes it into the
    # image, so .dwg upload works out of the box with no manual server
    # setup. Render's free plan supports Docker web services.
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://geodrill-five.vercel.app,https://www.geodrillinsight.com,https://geodrillinsight.com
      # DATABASE_URL: Neon connection string — Render dashboard'da manuel set edilmeli.
      #   Format: postgresql://USER:PASS@HOST/DB?sslmode=require
